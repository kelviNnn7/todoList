name: DesktopWidgets
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  TaskWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TaskWidget
        excludes:
          - Info.plist
          - TaskWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todo.desktop.widget
        PRODUCT_NAME: TaskWidget
        INFOPLIST_FILE: TaskWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TaskWidget/TaskWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  WidgetReloader:
    type: tool
    platform: macOS
    sources:
      - path: WidgetReloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todo.desktop.widget-reloader
        PRODUCT_NAME: WidgetReloader
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DesktopWidgets:
    build:
      targets:
        TaskWidget: all
        WidgetReloader: all
