name: Quality

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: runner.os == 'macOS'
        run: brew install xcodegen
      - if: runner.os == 'macOS'
        run: bash scripts/build-macos-dmg.sh
      - if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          if ($installer.Name -notmatch [regex]::Escape($version)) { throw "Installer version does not match package version" }
          if ($installer.Length -lt 1MB) { throw "NSIS installer is unexpectedly small" }
          $app = Get-ChildItem src-tauri/target/release/*.exe | Where-Object { $_.Name -notmatch 'build-script' } | Select-Object -First 1
          if (-not $app) { throw "Windows application executable was not generated" }
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Windows application exited during startup smoke test" }
          Stop-Process -Id $process.Id -Force
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: blunote-${{ runner.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
