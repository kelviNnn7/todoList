name: Quality

on:
  push:
    branches: [main, dev, "dev-*", "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: runner.os == 'macOS'
        run: brew install xcodegen
      - if: runner.os == 'macOS'
        run: bash scripts/build-macos-dmg.sh
      - if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: blunote-${{ runner.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  kylin:
    name: Kylin ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK and Linux packaging dependencies
        run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: bash scripts/ci-rust-check.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build:kylin
      - name: Validate Debian metadata
        run: dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
      - name: Validate AppImage architecture
        run: file src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: blunote-Kylin-${{ matrix.arch }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
